<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quote Generator</title> 
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
     <nav class="bg-blue-400 p-2 overflow-hidden"> 

      <h1 class=" md:text-4xl font-bold">Random Quote Generator</h1> 
  
     </nav> 

     <!--display--> 

     <div class="flex flex-col items-center justify-center">
      <div class=" shadow-2xl  md:h-100 md:w-125 rounded-lg bg-gray-400 scale-80 md:scale-100 p-5" >
         <div class="w-full h-full"> 
             <p id="quote" class="font-bold"></p> 
             <span id="person"></span>
         </div>
     </div>  
         <div>
            <button id="btn" class="bg-blue-400 text-white font-bold p-1 rounded-lg" id="btn">New quote</button>
         </div>
     </div>
     

     <script src="main.js"></script>
</body>
</html>
